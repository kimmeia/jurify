name: Smoke contra staging

# Roda os 3 specs leves (health, headers, login) contra a URL pública
# de staging. Se quebrar, dispara erro no Sentry de staging — aparece
# em /admin/erros.
#
# AGENDAMENTO PARADO.
#
# O spec de login depende de uma conta que só existe em staging depois que o
# workflow "Seed staging (one-shot)" roda, e ele precisa de dois secrets que
# ainda não foram criados: SEED_DATABASE_URL e SMOKE_PASSWORD. Sem eles o
# login falha em toda execução — de 15 em 15 minutos, vermelho constante. Um
# alarme que dispara sempre é um alarme que ninguém lê, e o custo real é o dia
# em que quebrar algo de verdade e a falha se perder no meio das outras.
#
# Pra religar, na ordem:
#   1. criar os secrets SEED_DATABASE_URL e SMOKE_PASSWORD;
#   2. rodar "Seed staging (one-shot)" uma vez;
#   3. disparar este workflow no botão e confirmar que passa;
#   4. descomentar as duas linhas de `schedule` abaixo.
on:
  # schedule:
  #   - cron: "*/15 * * * *" # a cada 15 minutos
  workflow_dispatch: # disparo manual — o único caminho enquanto o cron está parado

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Configurar em Repo Settings > Secrets > Actions:
      #   STAGING_BASE_URL = https://staging.jurify.com.br (ou Railway URL)
      PLAYWRIGHT_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
      # A senha das contas de teste, a MESMA que o workflow "Seed staging"
      # gravou. Sem ela o robô tenta a senha de fábrica, que só vale no banco
      # descartável da CI, e o login falha sem dizer por quê.
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install (sem build scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke (health + headers + login)
        run: pnpm exec playwright test tests/e2e/health.spec.ts tests/e2e/headers.spec.ts tests/e2e/login.spec.ts
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-staging-report
          path: playwright-report/
          retention-days: 7
